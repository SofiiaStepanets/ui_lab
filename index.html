<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторні роботи — Степанець Софія</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6fa;
      color: #1f2937;
    }
    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 64px 24px;
    }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .subtitle { color: #6b7280; margin: 0 0 40px; }
    .card {
      display: block;
      padding: 20px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover, .card:focus-visible {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    .card-title { font-weight: 600; color: #2563eb; margin: 0 0 4px; }
    .card-text { margin: 0; color: #6b7280; font-size: 0.95rem; }
    footer {
      text-align: center;
      padding: 24px;
      color: #9ca3af;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Лабораторні роботи</h1>
    <p class="subtitle">Степанець Софія, група ІП-з41</p>

    <a class="card" href="ui-controls.html">
      <p class="card-title">Лабораторна робота 1: UI елементи</p>
      <p class="card-text">10 елементів інтерфейсу: робочі приклади та пояснення їх призначення</p>
    </a>
  </main>

  <footer>© 2026 Степанець Софія</footer>
</body>
</html>
